apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiops-backend-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aiops-backend
  template:
    metadata:
      labels:
        app: aiops-backend
    spec:
      containers:
      - name: aiops-backend-container
        image: aiops-backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3001
        env:
        - name: HOST
          value: "0.0.0.0"
        - name: CHAOS_ENABLED
          value: "true"
        # Load tests send every login from one IP; in-flight requests would hit the
        # auth limiter (middleware/rateLimiter.js). Off here, on by default elsewhere.
        - name: AUTH_RATE_LIMIT_ENABLED
          value: "false"
        # Generated catalogue for the load tests: ~5k places, ~50k reviews, 1k users
        # (config/seedData/generated.js). Added 2026-10-22, thesis phase 2.
        - name: SEED_DATASET
          value: "load"
        # Probes (added 2026-10-22, the same for every strategy, so the comparison is
        # "Kubernetes alone" vs "Kubernetes + agent"). Readiness: /ready answers 503 while the
        # process cannot reach its database pool (the stuck fault), and the pod leaves the Service.
        # Liveness: /health only, shallow as Kubernetes recommends (a liveness check on a
        # dependency restarts pods whenever the dependency is slow); timeout 5 s x 3 failures so
        # a busy but working pod is never killed, only one that stopped answering for ~30 s.
        readinessProbe:
          httpGet:
            path: /ready
            port: 3001
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        # CPU is deliberately exactly 1 core (see "Pod sizing" in CLAUDE.md):
        # Node.js runs requests on one thread, so it cannot use more than 1 core,
        # and a login (bcrypt) costs ~70ms CPU. With 1 core that fits inside a
        # single 100ms CFS period, so throttling only appears under real overload.
        # With less (e.g. 500m) every login gets throttled, which breaks the
        # throttling metric and all CPU thresholds (they are in absolute cores).
        # Changing this invalidates capacity_table.json and the trained model.
        resources:
          requests:
            cpu: "1"
            memory: "1Gi"
          limits:
            cpu: "1"
            memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: aiops-backend-service
  labels:
    app: aiops-backend
spec:
  type: NodePort
  selector:
    app: aiops-backend
  ports:
    - name: http
      port: 3001
      targetPort: 3001
      nodePort: 30001