# The native baseline (thesis phase 2, 2026-10-22): Kubernetes HPA on CPU, the mechanism Kubernetes ships,
# tuned as well as the measurements allow so the comparison with the agent is fair (design_decisions.md A24):
# - the same bounds as the agent (1-3 replicas);
# - target utilization 60%, from the same capacity measurement the agent is given (capacity_table.json,
#   capacity_discovery_log.csv of 2026-10-22/23): the mix costs 0.0083 core-s per request (median of the safe
#   steps), and the HPA scales up when utilization exceeds 1.1 x target (its default 10% tolerance), i.e. at
#   0.66 core = ~80 rps per pod. That is below the safe load of every count: 1 pod 95 rps, 2 pods 165 (82.5 per
#   pod, the binding one: on this laptop 2 pods reach the latency limit at only ~0.6 core each), 3 pods 255.
#   So the HPA keeps the NFRs at every count with the smallest margin; the default 70% (phase 1) would let
#   2 pods run to ~93 rps each, past their safe load;
# - scale-up immediate (the default), scale-down after 120 s of lower demand instead of the default 300 s
#   (about the agent's own reaction: 3 readings + 90 s settle), so neither strategy pays for a longer wait.
# The readiness and liveness probes of the deployment (2-target-app/backend-deployment.yaml) are part of the
# native setup for every strategy. Phase 1 used target 70% and the default behaviour ("HPA as shipped").
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: aiops-backend-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: aiops-backend-deployment
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
